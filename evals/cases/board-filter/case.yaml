schema_version: "1.0"
name: board-filter
description: A React feature on a small task board. Hidden tests click through the filter, and collateral tests cover adding, ticking and removing.
tags: [outcome, ui, react, tune]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    /tblock:tblock-mode Add a filter bar to the task board with three buttons: All, Active and Done.
    Each shows its count, like `Active (2)`, and the selected one has aria-pressed="true". All is selected at the start.
    The list shows only the matching tasks. When none match, show `Nothing here.` where the list would be.
    The filter stays selected when I add, tick or remove a task.
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Edit, Write, Bash, Glob, Grep, Skill, Agent, Task, TodoWrite]
runs: 3
graders:
  - name: reply-shows-evidence
    type: llm
    criteria: >-
      The final reply (1) names the test or command that was run after the change and what it printed or reported,
      such as a pass count, and (2) says plainly what was not checked, such as not having seen it in a browser,
      or that nothing was left unchecked. A reply that only says the feature works, with no command or observed result, fails.
