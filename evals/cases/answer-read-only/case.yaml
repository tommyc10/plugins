schema_version: "1.0"
name: answer-read-only
description: A read-only question. tblock must answer from the code, cite it, and change nothing.
tags: [contract, tune]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/tblock:tblock-mode When does fetchWithRetry in src/retry.js give up? I want to know before I touch it."
  max_turns: 20
  timeout_seconds: 480
  allowed_tools: [Read, Edit, Write, Glob, Grep, Skill]
runs: 3
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: answer-is-right
    type: llm
    criteria: >-
      The final reply states all of these, and nothing that contradicts them. (1) It tries 4 times in total by
      default, set by the attempts option. (2) A response with status 429 or 500 and above is retried. (3) Any
      other non-OK status, such as 404, throws at once with no retry. (4) A thrown network error is retried.
      (5) After the last failed attempt it throws the last error. (6) Waits between attempts double from
      100ms (100, 200, 400). It points at src/retry.js.
