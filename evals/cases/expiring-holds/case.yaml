schema_version: "1.0"
name: expiring-holds
description: Held out. A feature on an inventory module with an injected clock, a report and an order flow beside it.
tags: [outcome, feature, heldout]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    /tblock:tblock-mode Stock holds should expire. `reserve(sku, qty, { ttlMs })` should hold the stock for that long,
    and after that it counts as free again. Without ttlMs a hold never expires, same as today.
    Add `sweep()` to the inventory. It drops the expired holds and returns their ids.
    Releasing an expired hold is an error, the same as releasing one that doesn't exist.
    The stock report's reserved column has to leave expired holds out too.
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Edit, Write, Bash, Glob, Grep, Skill, Agent, Task, TodoWrite]
runs: 3
graders:
  - name: reply-shows-evidence
    type: llm
    criteria: >-
      The final reply (1) names the test or command that was run after the change and what it printed or reported,
      such as a pass count, and (2) says plainly what was not checked, or that nothing was left unchecked.
      A reply that only says the feature works, with no command or observed result, fails.
